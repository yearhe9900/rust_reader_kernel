[package]
name = "rrk-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]
# 独立于根 workspace（cargo-fuzz 约定）。

[dependencies]
libfuzzer-sys = "0.4"
rrk-model = { path = "../crates/rrk-model" }
rrk-format = { path = "../crates/rrk-format" }
rrk-zip = { path = "../crates/rrk-zip" }
rrk-markup = { path = "../crates/rrk-markup" }
rrk-image = { path = "../crates/rrk-image" }
rrk-pdf = { path = "../crates/rrk-pdf" }
rrk-epub = { path = "../crates/rrk-epub" }
rrk-txt = { path = "../crates/rrk-txt" }
rrk-mobi = { path = "../crates/rrk-mobi" }
rrk-cbz = { path = "../crates/rrk-cbz" }

[[bin]]
name = "zip_parse"
path = "fuzz_targets/zip_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "format_open"
path = "fuzz_targets/format_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "markup_clean"
path = "fuzz_targets/markup_clean.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image_probe"
path = "fuzz_targets/image_probe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdf_open"
path = "fuzz_targets/pdf_open.rs"
test = false
doc = false
bench = false
