[workspace]
resolver = "2"
members = [
    "crates/rrk-model",
    "crates/rrk-format",
    "crates/rrk-markup",
    "crates/rrk-zip",
    "crates/rrk-image",
    "crates/rrk-txt",
    "crates/rrk-epub",
    "crates/rrk-mobi",
    "crates/rrk-cbz",
    "crates/rrk-pdf",
    "crates/rrk-cache",
    "crates/rrk-search",
    "crates/rrk-layout",
    "crates/rrk-kernel",
    "crates/rrk-ffi",
    "crates/rrk-inspect",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yearhe9900/rust_reader_kernel"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
rrk-model = { path = "crates/rrk-model" }
rrk-format = { path = "crates/rrk-format" }
rrk-markup = { path = "crates/rrk-markup" }
rrk-zip = { path = "crates/rrk-zip" }
rrk-image = { path = "crates/rrk-image" }
rrk-txt = { path = "crates/rrk-txt" }
rrk-epub = { path = "crates/rrk-epub" }
rrk-mobi = { path = "crates/rrk-mobi" }
rrk-cbz = { path = "crates/rrk-cbz" }
rrk-pdf = { path = "crates/rrk-pdf" }
rrk-cache = { path = "crates/rrk-cache" }
rrk-search = { path = "crates/rrk-search" }
rrk-layout = { path = "crates/rrk-layout" }
rrk-kernel = { path = "crates/rrk-kernel" }

# 依赖白名单（方案 §3.2）：纯 Rust、可审计、可 fork、许可宽松。
# 禁止 pdfium / mupdf / unrar / 闭源 SDK / 预编译黑盒二进制。
encoding_rs = "0.8"      # 编码转换（Firefox 同源，纯 Rust）
chardetng = "0.1"        # 编码检测（纯 Rust）
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }  # inflate（miniz_oxide 纯 Rust）

[profile.release]
opt-level = 3
lto = "thin"
strip = true
