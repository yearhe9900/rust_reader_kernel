name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: ABI 常量五处一致（深审 B3）
        # Rust / Dart / 头文件 / CHANGELOG / ROADMAP 漏同步即刻变红
        run: bash scripts/check-abi.sh
      - name: 全量单测
        run: cargo test --workspace
      - name: FFI 红线（panic 不跨界：clippy 禁 unwrap/expect/panic）
        # --no-deps：红线只对 rrk-ffi 生效（不外溢到工作区路径依赖）
        run: cargo clippy -p rrk-ffi --no-deps -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
      - name: 全 workspace clippy（不启用 FFI 专属红线，口径见 CONTRIBUTING §架构约束 6）
        run: cargo clippy --workspace --no-deps
      - name: rrk-inspect 冒烟（样张）
        # PDF 暂停、入口关闭：不再冒烟 fixtures/sample.pdf（inspect 已打不开 PDF）
        run: |
          cargo build --release -p rrk-inspect
          ./target/release/rrk-inspect fixtures/sample.epub >/dev/null
          ./target/release/rrk-inspect fixtures/sample.cbz >/dev/null
      - name: 规模化语料回归（深审 C4：200 章嵌套目录 + 内链 + 索引往返）
        # 有版权真书不入库；本测试用确定性生成的合成大书挡索引重建类回归
        run: cargo test -p rrk-epub corpus_scale -- --nocapture
      - name: 真书语料（可选，放入 fixtures/corpus/ 才跑）
        run: |
          if [ -d fixtures/corpus ]; then
            bash scripts/corpus_check.sh fixtures/corpus/*
          else
            echo "未提供真书语料（版权文件不入库），跳过"
          fi
      - name: 安装 cbindgen（头文件漂移校验）
        run: cargo install cbindgen --locked
      - name: C 头文件与源码一致（cbindgen --verify）
        run: cbindgen --verify --output bindings/rrk.h crates/rrk-ffi --config cbindgen.toml
      - name: C 头文件语法检查
        run: gcc -fsyntax-only -Wall -Wextra bindings/rrk.h

  dart-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建 rrk_ffi
        run: cargo build --release -p rrk-ffi
      - name: rrk_reader analyze + 冒烟
        working-directory: bindings/dart/rrk_reader
        run: |
          dart pub get
          dart analyze
          dart run example/smoke.dart ../../../target/release/librrk_ffi.so ../../../fixtures/sample.txt

  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: demo analyze + test
        working-directory: demo/flutter_reader
        run: |
          flutter pub get
          flutter analyze
          flutter test

  bench:
    # 基准护栏（宽松阈值，只抓灾难性性能回归；精细调优本地测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 清洗层基准（bench 盲区）
        run: cargo run --release -p rrk-markup --example bench_markup
      - name: 检索/索引基准（bench 盲区）
        run: cargo run --release -p rrk-search --example bench_search
      - name: 排版基准（P1 判据 ≤200ms/章）
        run: cargo run --release -p rrk-layout --example bench_layout -- fixtures/sample.txt
      - name: FFI 出口基准（部件流/缓存命中/光栅化）
        run: cargo run --release -p rrk-ffi --example bench_ffi

  fuzz:
    # cargo-fuzz 每目标短跑（覆盖引导）；崩溃会把输入存进 artifacts 并使 job 失败
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: 安装 cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: zip 中央目录 + 条目读取
        id: fuzz_zip
        continue-on-error: true
        run: cargo fuzz run zip_parse fuzz/seed-corpus/zip_parse -- -max_total_time=30 -timeout=10
      - name: 五格式适配器打开
        id: fuzz_format
        continue-on-error: true
        run: cargo fuzz run format_open fuzz/seed-corpus/format_open -- -max_total_time=30 -timeout=10
      - name: XHTML 清洗管线
        id: fuzz_markup
        continue-on-error: true
        run: cargo fuzz run markup_clean fuzz/seed-corpus/markup_clean -- -max_total_time=30 -timeout=10
      - name: 图片头解析/缩略图
        id: fuzz_image
        continue-on-error: true
        run: cargo fuzz run image_probe fuzz/seed-corpus/image_probe -- -max_total_time=30 -timeout=10
      - name: PDF 解析/页视图/栅格化
        id: fuzz_pdf
        continue-on-error: true
        run: cargo fuzz run pdf_open fuzz/seed-corpus/pdf_open -- -max_total_time=30 -timeout=10
      - name: 汇总判定（任一目标失败则红；全部跑完不短路）
        run: |
          echo "zip=${{ steps.fuzz_zip.outcome }} format=${{ steps.fuzz_format.outcome }} markup=${{ steps.fuzz_markup.outcome }} image=${{ steps.fuzz_image.outcome }} pdf=${{ steps.fuzz_pdf.outcome }}"
          [ "${{ steps.fuzz_zip.outcome }}" = "success" ] || exit 1
          [ "${{ steps.fuzz_format.outcome }}" = "success" ] || exit 1
          [ "${{ steps.fuzz_markup.outcome }}" = "success" ] || exit 1
          [ "${{ steps.fuzz_image.outcome }}" = "success" ] || exit 1
          [ "${{ steps.fuzz_pdf.outcome }}" = "success" ] || exit 1
      - name: 上传崩溃样例
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  build-ffi:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建 rrk_ffi（预编译产物）
        run: cargo build --release -p rrk-ffi
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: rrk_ffi-${{ matrix.os }}
          path: |
            target/release/rrk_ffi.dll
            target/release/librrk_ffi.so
            target/release/librrk_ffi.dylib
          if-no-files-found: ignore
